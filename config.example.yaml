# Copy to /data/config.yaml. Environment variables (KINO_*) override these values.
workers: 2
ort_threads: 2
embedder: auraface   # auraface | buffalo_l
det_size: 1024
tiling: auto         # off | auto | always
tile_overlap: 0.2
raw_retention_days: 7
face_retention_days: 30
forward_rate_per_min: 6
# Telegram delivery (the bot token is better kept in KINO_TELEGRAM_BOT_TOKEN or the web UI)
# telegram_api_url: https://api.telegram.org
telegram_rate_per_min: 20
log_level: INFO

# OpenWA integration notes (doc-derived, see kino/openwa/schemas.py for sources):
#   webhook signature header: X-OpenWA-Signature = "sha256=<hex HMAC-SHA256 of raw body>"
#   REST auth header: X-API-Key
#   send-text:  POST /api/sessions/{sid}/messages/send-text   {chatId, text}
#   send-image: POST /api/sessions/{sid}/messages/send-image  {chatId, base64, mimetype, caption}
#   get-media:  GET  /api/sessions/{sid}/messages/{chatId}/{messageId}/media

# Remove GPS EXIF from saved (and therefore forwarded) photos; default true
strip_gps: true

# IANA time zone for photo folders/filenames and EXIF local time (default UTC)
timezone: Asia/Jerusalem
