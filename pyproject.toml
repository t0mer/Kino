[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kino"
version = "0.0.0"
description = "Finds your kids in WhatsApp group photos and saves them per kid"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "loguru==0.7.3",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "huey==3.4.0",
    "typer==0.27.3",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "opencv-python-headless==5.0.0.93",
    "filelock==4.1.0",
    "prometheus-client==0.26.0",
    "imagehash==4.3.2",
    "pillow==12.3.0",
    "pillow-heif==1.8.0",
    "piexif==1.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "httpx==0.28.1",
    "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
kino = "kino.cli:app"

[tool.setuptools.packages.find]
include = ["kino*"]

[tool.setuptools.package-data]
"kino.db" = ["alembic/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["models: hits the network to check real model URLs (opt-in)"]
addopts = "-m 'not models'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kino.pipeline.*", "kino.api.*"]
strict = true

[tool.ruff.lint.per-file-ignores]
"kino/db/alembic/versions/*" = ["E501", "I", "UP"]

[[tool.mypy.overrides]]
module = ["imagehash", "huey", "huey.*", "piexif", "pillow_heif"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Vendored from InsightFace (MIT); keep numpy-typing noise out of strict checks.
module = ["kino.pipeline._insightface.*"]
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
